name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        node: ['22.13.1', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bash test/run-all.sh
        env:
          DISKWATCH_STATE_DIR: ${{ runner.temp }}/diskwatch-ci
      - run: npm run share
